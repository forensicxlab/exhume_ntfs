[package]
name = "exhume_ntfs"
version = "0.1.18"
edition = "2024"
description = "Extract NT Filesystem specific artefacts from a given Partition."
documentation = "https://www.forensicxlab.com/docs/category/exhume---ntfs"
authors = ["k1nd0ne"]
repository = "https://github.com/forensicxlab/exhume_ntfs"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
exhume_body = "=0.5.7"
log = "0.4.25"
clap = { version = "4.5", features = ["cargo"] }
clap-num = "1.1.1"
prettytable-rs = "^0.10"
capstone = "0.13.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
env_logger = "0.11.6"
byteorder = "1.4"
aes = { version = "0.8", features = ["zeroize"] }
xts-mode = "0.5"
cipher = "0.4"
hex = "0.4"
rayon = "1.8"

[dev-dependencies]
sha2 = "0.10"
